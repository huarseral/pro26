<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAChirana Plat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Overlay -->
    <div id="offcanvasOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"></div>

    <!-- Offcanvas Menu -->
    <div id="offcanvasMenu" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg transform -translate-x-full transition-transform duration-300 z-50">
        <!-- Menu Header -->
        <div class="flex items-center justify-between p-6 border-b">
            <h2 class="text-xl font-bold text-gray-800">Menu</h2>
            <button id="closeOffcanvas" class="text-gray-600 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Menu Items -->
        <nav class="p-6">
            <ul class="space-y-4">
                <li><a href="#" class="block text-gray-700 hover:text-blue-600 font-medium transition">Home</a></li>
                <li><a href="#" class="block text-gray-700 hover:text-blue-600 font-medium transition">About</a></li>
                <li><a href="#" class="block text-gray-700 hover:text-blue-600 font-medium transition">Services</a></li>
                <li><a href="#" class="block text-gray-700 hover:text-blue-600 font-medium transition">Contact</a></li>
            </ul>
        </nav>
    </div>

    <!-- Header -->
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-800">LAChirana Plat</h1>
            <button id="openOffcanvas" class="text-gray-700 hover:text-gray-900 p-2 rounded-lg hover:bg-gray-100 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        <!-- Gallery Section -->
        <div class="mb-12">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Galería de Imágenes</h2>

            <!-- Gallery Container -->
            <div class="relative bg-white rounded-lg shadow-lg overflow-hidden">
                <!-- Images Carousel -->
                <div class="relative w-full h-96 md:h-96 lg:h-96">
                    <div id="galleryContainer" class="relative w-full h-full">
                        <!-- Image 1 -->
                        <div class="gallery-item absolute inset-0 opacity-0 transition-opacity duration-1000">
                            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=600&fit=crop" alt="Mountain landscape" class="w-full h-full object-cover">
                        </div>
                        <!-- Image 2 -->
                        <div class="gallery-item absolute inset-0 opacity-0 transition-opacity duration-1000">
                            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&h=600&fit=crop" alt="Portrait" class="w-full h-full object-cover">
                        </div>
                        <!-- Image 3 -->
                        <div class="gallery-item absolute inset-0 opacity-0 transition-opacity duration-1000">
                            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&h=600&fit=crop" alt="Beach sunset" class="w-full h-full object-cover">
                        </div>
                        <!-- Image 4 -->
                        <div class="gallery-item absolute inset-0 opacity-0 transition-opacity duration-1000">
                            <img src="https://images.unsplash.com/photo-1506394881985-37f241a5d6f7?w=800&h=600&fit=crop" alt="City lights" class="w-full h-full object-cover">
                        </div>
                        <!-- Image 5 -->
                        <div class="gallery-item absolute inset-0 opacity-0 transition-opacity duration-1000">
                            <img src="https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=800&h=600&fit=crop" alt="Forest nature" class="w-full h-full object-cover">
                        </div>
                    </div>

                    <!-- Previous Button -->
                    <button id="prevBtn" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 hover:bg-opacity-75 text-white p-2 rounded-full transition z-10">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>

                    <!-- Next Button -->
                    <button id="nextBtn" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 hover:bg-opacity-75 text-white p-2 rounded-full transition z-10">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>

                    <!-- Play/Pause Button -->
                    <button id="playPauseBtn" class="absolute bottom-4 right-4 bg-black bg-opacity-50 hover:bg-opacity-75 text-white px-4 py-2 rounded-full transition z-10 flex items-center gap-2">
                        <svg id="playIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                        <svg id="pauseIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"></path>
                        </svg>
                    </button>
                </div>

                <!-- Indicators -->
                <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2 z-10">
                    <div id="indicator0" class="indicator w-3 h-3 bg-white rounded-full cursor-pointer opacity-100 transition" data-index="0"></div>
                    <div id="indicator1" class="indicator w-3 h-3 bg-white rounded-full cursor-pointer opacity-50 transition" data-index="1"></div>
                    <div id="indicator2" class="indicator w-3 h-3 bg-white rounded-full cursor-pointer opacity-50 transition" data-index="2"></div>
                    <div id="indicator3" class="indicator w-3 h-3 bg-white rounded-full cursor-pointer opacity-50 transition" data-index="3"></div>
                    <div id="indicator4" class="indicator w-3 h-3 bg-white rounded-full cursor-pointer opacity-50 transition" data-index="4"></div>
                </div>
            </div>
        </div>

        <!-- Welcome Section -->
        <div class="bg-white rounded-lg shadow p-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Bienvenido</h2>
            <p class="text-gray-600 text-lg">Haz clic en el menú para abrir el offcanvas. La galería se reproduce automáticamente o puedes navegar manualmente.</p>
        </div>
    </main>

    <script>
        // ========== OFFCANVAS MENU ==========
        const openBtn = document.getElementById('openOffcanvas');
        const closeBtn = document.getElementById('closeOffcanvas');
        const offcanvasMenu = document.getElementById('offcanvasMenu');
        const overlay = document.getElementById('offcanvasOverlay');

        openBtn.addEventListener('click', () => {
            offcanvasMenu.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        });

        const closeOffcanvas = () => {
            offcanvasMenu.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        };

        closeBtn.addEventListener('click', closeOffcanvas);
        overlay.addEventListener('click', closeOffcanvas);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeOffcanvas();
        });

        // ========== GALLERY CAROUSEL ==========
        let currentIndex = 0;
        let isAutoplay = true;
        let autoplayInterval;

        const galleryItems = document.querySelectorAll('.gallery-item');
        const indicators = document.querySelectorAll('.indicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        // Mostrar imagen actual
        function showImage(index) {
            galleryItems.forEach((item, i) => {
                item.classList.toggle('opacity-0', i !== index);
                item.classList.toggle('opacity-100', i === index);
            });

            // Actualizar indicadores
            indicators.forEach((indicator, i) => {
                indicator.classList.toggle('opacity-100', i === index);
                indicator.classList.toggle('opacity-50', i !== index);
            });
        }

        // Siguiente imagen
        function nextImage() {
            currentIndex = (currentIndex + 1) % galleryItems.length;
            showImage(currentIndex);
        }

        // Imagen anterior
        function prevImage() {
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            showImage(currentIndex);
        }

        // Autoplay
        function startAutoplay() {
            autoplayInterval = setInterval(nextImage, 5000);
        }

        function stopAutoplay() {
            clearInterval(autoplayInterval);
        }

        // Event listeners
        prevBtn.addEventListener('click', () => {
            prevImage();
            if (isAutoplay) {
                stopAutoplay();
                startAutoplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            nextImage();
            if (isAutoplay) {
                stopAutoplay();
                startAutoplay();
            }
        });

        // Play/Pause
        playPauseBtn.addEventListener('click', () => {
            isAutoplay = !isAutoplay;
            if (isAutoplay) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                startAutoplay();
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                stopAutoplay();
            }
        });

        // Indicadores
        indicators.forEach((indicator) => {
            indicator.addEventListener('click', () => {
                currentIndex = parseInt(indicator.dataset.index);
                showImage(currentIndex);
                if (isAutoplay) {
                    stopAutoplay();
                    startAutoplay();
                }
            });
        });

        // Inicializar
        showImage(0);
        startAutoplay();
    </script>
</body>
</html>
